<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<style>
  :root { --ease: cubic-bezier(.32,.72,0,1); }
  html, body { margin: 0; background: transparent; overflow: hidden; user-select: none; }
  body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI Variable Text", "Segoe UI", "PingFang SC", "Microsoft YaHei UI", sans-serif; }
  /* 贴纸尺寸对标桌面图标（约 56-64px），窗体只留气泡的溢出空间 */
  .wrap { position: relative; width: 128px; height: 104px; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; }
  .kiko {
    width: 56px; height: 56px; border-radius: 50%; object-fit: cover; object-position: center 32%;
    border: 2.5px solid rgba(255,255,255,.92); background: #dfe6f5; cursor: grab; /* 待办40：去除圆形外围阴影 */
    animation: float 3.2s var(--ease) infinite;
  }
  .kiko:active { cursor: grabbing; }
  .kiko.wide { width: 76px; height: 44px; border-radius: 14px; object-fit: cover; object-position: 50% 62%; animation: none; }
  .kiko.zoom { transform: scale(1.06); }
  /* 吸边隐藏：形象贴向"留在屏内的那一侧"，窄条里必须看得见头
     edge-left：窗体右边在屏内→靠右；edge-right：窗体左边在屏内→靠左；
     edge-top：窗体下边在屏内→靠下（默认已贴底）；edge-bottom：窗体上边在屏内→贴上 */
  .kiko { transition: transform .3s var(--ease); }
  .wrap.edge-left { align-items: flex-end; }
  .wrap.edge-right { align-items: flex-start; }
  .wrap.edge-bottom { justify-content: flex-start; }
  .wrap.edge-left .kiko, .wrap.edge-right .kiko, .wrap.edge-top .kiko, .wrap.edge-bottom .kiko { animation: none; }
  .speech { max-width: 100px; }
  @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
  .speech {
    position: absolute; bottom: 66px; left: 50%; transform: translate(-50%, 6px) scale(.94);
    background: rgba(255,255,255,.82); color: #0b1220; font-size: 10px; line-height: 1.45;
    width: 118px; padding: 5px 8px; border-radius: 12px 12px 12px 3px; text-align: center;
    border: 1px solid rgba(255,255,255,.8); backdrop-filter: blur(14px) saturate(1.7); -webkit-backdrop-filter: blur(14px) saturate(1.7);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.9), 0 4px 14px rgba(14,38,86,.18); opacity: 0; pointer-events: none;
    transition: all .32s var(--ease);
  }
  .speech.show { opacity: 1; transform: translate(-50%, 0) scale(1); }
  @media (prefers-reduced-motion: reduce) { .kiko { animation: none; } * { transition-duration: .01ms !important; } }
</style>
</head>
<body>
  <div class="wrap">
    <div class="speech" id="speech"></div>
    <img class="kiko" id="kiko" src="dist/kiko/idle.png" alt="KIKO" draggable="false" />
  </div>
<script>
  const STATES = { idle: 'idle', working: 'working', done: 'done', thinking: 'thinking', sleeping: 'sleeping', bubble: 'bubble' };
  const img = document.getElementById('kiko');
  const speech = document.getElementById('speech');
  let state = 'idle', autoTimer = null, sleepTimer = null, sayTimer = null;

  function setState(s) {
    if (!STATES[s]) s = 'idle';
    state = s;
    img.src = 'dist/kiko/' + s + '.png';
    img.classList.toggle('wide', s === 'sleeping' || s === 'bubble');
    clearTimeout(autoTimer);
    /* working 由主流程事件驱动退出；done/thinking/bubble 自动回闲 */
    if (s === 'done' || s === 'thinking') autoTimer = setTimeout(() => setState('idle'), 4500);
    if (s === 'bubble') autoTimer = setTimeout(() => setState('idle'), 8000);
    resetSleepTimer();
  }
  function resetSleepTimer() {
    clearTimeout(sleepTimer);
    if (state === 'idle') sleepTimer = setTimeout(() => setState('sleeping'), 5 * 60 * 1000);
  }
  function say(text) {
    speech.textContent = text;
    speech.classList.add('show');
    if (state !== 'working') setState('bubble');
    clearTimeout(sayTimer);
    sayTimer = setTimeout(() => { speech.classList.remove('show'); }, 6500);
  }

  /* 拖动：位移>4 视为拖拽（吞掉后续 click），松手通知主进程存位置 */
  let down = null, moved = false;
  img.addEventListener('mousedown', e => {
    if (e.button !== 0) return;
    down = { x: e.screenX, y: e.screenY }; moved = false;
    img.classList.add('zoom');
  });
  window.addEventListener('mousemove', e => {
    if (!down || e.buttons !== 1) return;
    const dx = e.screenX - down.x, dy = e.screenY - down.y;
    if (Math.abs(dx) + Math.abs(dy) > 4) moved = true;
    if (moved) { down = { x: e.screenX, y: e.screenY }; window.pet.move(dx, dy); }
  });
  window.addEventListener('mouseup', () => {
    if (!down) return;
    down = null; img.classList.remove('zoom');
    if (moved) window.pet.drop();
  });
  img.addEventListener('click', () => { if (!moved) window.pet.click(); });
  img.addEventListener('dblclick', () => window.pet.dbl());
  window.addEventListener('contextmenu', e => { e.preventDefault(); window.pet.menu(); });

  const wrap = document.querySelector('.wrap');
  wrap.addEventListener('mouseenter', () => window.pet.enter());
  wrap.addEventListener('mouseleave', () => window.pet.leave());
  window.pet.onEdge(edge => {
    wrap.classList.remove('edge-left', 'edge-right', 'edge-top', 'edge-bottom');
    if (edge) wrap.classList.add('edge-' + edge);
  });

  window.pet.onState(s => setState(s));
  window.pet.onSay(say);
  resetSleepTimer();
</script>
</body>
</html>
