<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<style>
  :root { --ease: cubic-bezier(.32,.72,0,1); --pet-scale: 1; }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 128px; height: 104px; background: transparent; overflow: hidden; user-select: none; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei UI", sans-serif; }
  .wrap { position: relative; width: 128px; height: 104px; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; overflow: visible; }
  .kiko-stage { width: 92px; height: 86px; display: flex; align-items: center; justify-content: center; transform: scale(var(--pet-scale)); transform-origin: 50% 88%; position: relative; }
  .kiko { width: 76px; height: 76px; border-radius: 50%; object-fit: cover; object-position: center 32%; border: 2px solid rgba(255,255,255,.92); background: #dfe6f5; box-shadow: 0 4px 12px rgba(30,40,90,.22); cursor: grab; transform-origin: 50% 78%; animation: idle-float 3.4s ease-in-out infinite; transition: filter .2s ease; }
  .kiko:active { cursor: grabbing; }
  .kiko.wide { width: 88px; height: 54px; border-radius: 15px; object-fit: cover; object-position: 50% 62%; }
  .kiko.full { width: 84px; height: 86px; border-radius: 18px; object-fit: contain; background: transparent; border: 0; box-shadow: none; }
  .kiko.zoom { filter: brightness(1.04); }
  .wrap.edge-left { align-items: flex-end; }
  .wrap.edge-right { align-items: flex-start; }
  .wrap.edge-bottom { justify-content: flex-start; }
  .wrap.edge-left .tip, .wrap.edge-right .tip, .wrap.edge-top .tip, .wrap.edge-bottom .tip { display: none; }
  .speech { position: absolute; z-index: 5; bottom: 80px; left: 50%; width: 126px; padding: 6px 9px; border-radius: 12px 12px 12px 3px; transform: translate(-50%, 6px) scale(.94); background: rgba(255,255,255,.9); color: #182344; font-size: 10px; line-height: 1.5; text-align: center; border: 1px solid rgba(255,255,255,.9); backdrop-filter: blur(14px) saturate(1.6); box-shadow: 0 4px 14px rgba(14,38,86,.16); opacity: 0; pointer-events: none; transition: all .28s var(--ease); }
  .speech.show { opacity: 1; transform: translate(-50%, 0) scale(1); }
  .tip { margin-top: 2px; font-size: 8px; color: rgba(60,60,90,.55); text-shadow: 0 1px 0 rgba(255,255,255,.7); opacity: 0; transition: opacity .25s; white-space: nowrap; }
  .wrap:hover .tip { opacity: 1; }
  @keyframes idle-float { 0%,100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-3px) rotate(-1deg); } }
  @keyframes jump { 0%,100% { transform: translateY(0) scale(1); } 25% { transform: translateY(-24px) scale(1.04, .96); } 55% { transform: translateY(0) scale(.96,1.05); } 75% { transform: translateY(-9px) scale(1.02,.98); } }
  @keyframes roll { 0% { transform: rotate(0) translateY(0); } 35% { transform: rotate(150deg) translateY(-10px); } 70% { transform: rotate(300deg) translateY(0); } 100% { transform: rotate(360deg); } }
  @keyframes belly { 0%,100% { transform: rotate(0) translateY(0) scale(1); } 18% { transform: rotate(-13deg) translateY(-3px) scale(1.04); } 38% { transform: rotate(12deg) translateY(1px) scale(.98); } 58% { transform: rotate(-10deg) translateY(-2px) scale(1.03); } 78% { transform: rotate(8deg) translateY(0); } }
  @keyframes wave { 0%,100% { transform: rotate(0); } 25% { transform: rotate(-12deg) translateY(-5px); } 50% { transform: rotate(10deg) translateY(-2px); } 75% { transform: rotate(-7deg); } }
  @keyframes stretch { 0%,100% { transform: scale(1,1) translateY(0); } 40% { transform: scale(1.12,.88) translateY(4px); } 70% { transform: scale(.92,1.1) translateY(-4px); } }
  @keyframes think { 0%,100% { transform: translateX(0) rotate(0); } 25% { transform: translateX(-3px) rotate(-3deg); } 75% { transform: translateX(3px) rotate(3deg); } }
  @keyframes sleep { 0%,100% { transform: scale(1) translateY(0); } 50% { transform: scale(1.025,.98) translateY(1px); } }
  .kiko.action-jump { animation: jump .95s var(--ease) both; }
  .kiko.action-roll { animation: roll 1.35s var(--ease) both; }
  .kiko.action-belly { animation: belly 1.5s ease-in-out both; }
  .kiko.action-wave { animation: wave 1.1s ease-in-out both; }
  .kiko.action-stretch { animation: stretch 1.25s ease-in-out both; }
  .kiko.action-think { animation: think 1.6s ease-in-out infinite; }
  .kiko.action-sleep { animation: sleep 3s ease-in-out infinite; }
  .kiko.action-surprise { animation: jump .65s var(--ease) both; filter: brightness(1.08); }
  .kiko.state-working { animation: think .55s ease-in-out infinite; }
  .kiko.state-done { animation: jump .95s var(--ease) both; }
  .kiko.state-thinking { animation: think 1.6s ease-in-out infinite; }
  .kiko.state-sad { animation: think 2.2s ease-in-out infinite; filter: saturate(.72); }
  .kiko.state-sleeping { animation: sleep 3s ease-in-out infinite; }
  .kiko.dragging { animation: none !important; transform: scale(1.06) rotate(-5deg); }
  .edge-left .kiko, .edge-right .kiko, .edge-top .kiko, .edge-bottom .kiko { animation: none !important; }
  @media (prefers-reduced-motion: reduce) { .kiko { animation: none !important; } * { transition-duration: .01ms !important; } }
</style>
</head>
<body>
  <div class="wrap" id="wrap">
    <div class="speech" id="speech"></div>
    <div class="kiko-stage"><img class="kiko" id="kiko" src="dist/kiko/idle.png" alt="KIKO" draggable="false" /></div>
    <div class="tip">拖动移动 · 单击打开 · 双击速记 · 长按互动</div>
  </div>
<script>
  const STATES = new Set(['idle','working','done','thinking','sleeping','bubble','sad']);
  const ACTIONS = new Set(['jump','roll','belly','wave','stretch','think','sleep','surprise']);
  const img = document.getElementById('kiko');
  const speech = document.getElementById('speech');
  const wrap = document.getElementById('wrap');
  let state = 'idle', autoTimer = null, sleepTimer = null, sayTimer = null, actionTimer = null, randomTimer = null;
  let settings = { petScale: 1, petRandom: true, petBubbles: true };
  let down = null, moved = false, longPressed = false, longPressTimer = null, lastClickAt = 0;

  function applyImage(s) {
    const file = s === 'bubble' ? 'bubble' : (s === 'sad' ? 'thinking' : s);
    img.src = 'dist/kiko/' + file + '.png';
    img.classList.toggle('wide', s === 'sleeping' || s === 'bubble');
    img.classList.toggle('full', false);
  }
  function clearAction() {
    clearTimeout(actionTimer);
    img.className = 'kiko';
    img.classList.add('state-' + state);
  }
  function setState(s) {
    if (!STATES.has(s)) s = 'idle';
    state = s;
    applyImage(s);
    clearAction();
    clearTimeout(autoTimer);
    if (s === 'done' || s === 'thinking' || s === 'sad' || s === 'bubble') autoTimer = setTimeout(() => setState('idle'), s === 'bubble' ? 8000 : 5200);
    resetSleepTimer();
  }
  function resetSleepTimer() {
    clearTimeout(sleepTimer);
    if (state === 'idle') sleepTimer = setTimeout(() => { setState('sleeping'); playAction('sleep'); }, 5 * 60 * 1000);
    scheduleRandom();
  }
  function scheduleRandom() {
    clearTimeout(randomTimer);
    if (!settings.petRandom || state !== 'idle') return;
    randomTimer = setTimeout(() => {
      if (state === 'idle') playAction(['wave','stretch','surprise'][Math.floor(Math.random() * 3)]);
      scheduleRandom();
    }, 24000 + Math.floor(Math.random() * 18000));
  }
  function playAction(action) {
    if (!ACTIONS.has(action)) return;
    if (state === 'sleeping' && action !== 'sleep') setState('idle');
    clearTimeout(actionTimer);
    img.className = 'kiko action-' + action;
    if (action === 'think' || action === 'sleep') return;
    actionTimer = setTimeout(() => {
      img.className = 'kiko state-' + state;
    }, action === 'roll' ? 1450 : 1650);
    resetSleepTimer();
  }
  function say(text) {
    if (!settings.petBubbles || !text) return;
    speech.textContent = String(text).slice(0, 100);
    speech.classList.add('show');
    if (state !== 'working') setState('bubble');
    clearTimeout(sayTimer);
    sayTimer = setTimeout(() => speech.classList.remove('show'), 6500);
  }
  function applySettings(next) {
    settings = { ...settings, ...(next || {}) };
    const scale = Math.max(.75, Math.min(1.45, Number(settings.petScale) || 1));
    document.documentElement.style.setProperty('--pet-scale', String(scale));
    scheduleRandom();
  }

  /* 拖动、点击与长按：保留原有单击打开/双击速记；长按触发抚摸反应。 */
  img.addEventListener('mousedown', e => {
    if (e.button !== 0) return;
    down = { x: e.screenX, y: e.screenY }; moved = false; longPressed = false;
    img.classList.add('zoom','dragging');
    clearTimeout(longPressTimer);
    longPressTimer = setTimeout(() => {
      if (down && !moved) { longPressed = true; playAction('belly'); say('嘿嘿，好痒呀！'); }
    }, 560);
  });
  window.addEventListener('mousemove', e => {
    if (!down || e.buttons !== 1) return;
    const dx = e.screenX - down.x, dy = e.screenY - down.y;
    if (Math.abs(dx) + Math.abs(dy) > 4) { moved = true; clearTimeout(longPressTimer); }
    if (moved) { down = { x: e.screenX, y: e.screenY }; window.pet.move(dx, dy); }
  });
  window.addEventListener('mouseup', () => {
    if (!down) return;
    down = null; clearTimeout(longPressTimer); img.classList.remove('zoom','dragging');
    if (moved) window.pet.drop();
    else if (longPressed) { moved = true; }
  });
  img.addEventListener('click', e => {
    if (moved || longPressed) { e.preventDefault(); moved = false; longPressed = false; return; }
    const now = Date.now();
    if (now - lastClickAt < 360) { lastClickAt = 0; return; }
    lastClickAt = now;
    window.pet.click();
  });
  img.addEventListener('dblclick', e => { e.preventDefault(); lastClickAt = 0; window.pet.dbl(); });
  window.addEventListener('contextmenu', e => { e.preventDefault(); window.pet.menu(); });
  wrap.addEventListener('mouseenter', () => window.pet.enter());
  wrap.addEventListener('mouseleave', () => window.pet.leave());
  window.pet.onEdge(edge => {
    wrap.classList.remove('edge-left','edge-right','edge-top','edge-bottom');
    if (edge) wrap.classList.add('edge-' + edge);
  });
  window.pet.onState(setState);
  window.pet.onSay(say);
  window.pet.onAction(playAction);
  window.pet.onSettings(applySettings);
  applySettings({});
  resetSleepTimer();
</script>
</body>
</html>
